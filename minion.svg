<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <clipPath id="body">
      <rect x="56" y="40" width="120" height="180" rx="60"/>
    </clipPath>
  </defs>

  <!-- flag pole and flag: red over black -->
  <line x1="196" y1="40" x2="196" y2="228" stroke="#5a3b1e" stroke-width="6" stroke-linecap="round"/>
  <rect x="199" y="42" width="52" height="25" fill="#d7141a"/>
  <rect x="199" y="67" width="52" height="25" fill="#111111"/>

  <!-- left arm -->
  <line x1="62" y1="138" x2="44" y2="170" stroke="#f9d71c" stroke-width="14" stroke-linecap="round"/>

  <!-- body -->
  <rect x="56" y="40" width="120" height="180" rx="60" fill="#f9d71c" stroke="#d4b100" stroke-width="3"/>

  <!-- overalls -->
  <g clip-path="url(#body)">
    <path d="M56 150 H176 V160 A60 60 0 0 1 56 160 Z" fill="#2f5fa8"/>
    <!-- goggle strap -->
    <rect x="50" y="72" width="132" height="14" fill="#333333"/>
  </g>
  <line x1="92" y1="132" x2="66" y2="106" stroke="#2f5fa8" stroke-width="8" stroke-linecap="round"/>
  <line x1="140" y1="132" x2="166" y2="106" stroke="#2f5fa8" stroke-width="8" stroke-linecap="round"/>
  <rect x="88" y="132" width="56" height="30" rx="5" fill="#2f5fa8" stroke="#1f3f75" stroke-width="3"/>
  <rect x="104" y="142" width="24" height="12" rx="3" fill="none" stroke="#1f3f75" stroke-width="2"/>

  <!-- goggle and eye -->
  <circle cx="116" cy="79" r="26" fill="#bfc4c8" stroke="#555555" stroke-width="6"/>
  <circle cx="116" cy="79" r="18" fill="#ffffff"/>
  <circle cx="118" cy="79" r="8" fill="#3b2a1a"/>
  <circle cx="121" cy="76" r="2.5" fill="#ffffff"/>

  <!-- mouth and hair -->
  <path d="M102 116 Q116 128 130 116" fill="none" stroke="#5a3b1e" stroke-width="4" stroke-linecap="round"/>
  <path d="M112 42 Q108 30 104 25 M120 42 Q122 30 128 25" fill="none" stroke="#333333" stroke-width="3" stroke-linecap="round"/>

  <!-- right arm holding the pole -->
  <line x1="170" y1="138" x2="194" y2="128" stroke="#f9d71c" stroke-width="14" stroke-linecap="round"/>
  <circle cx="196" cy="128" r="9" fill="#f9d71c" stroke="#d4b100" stroke-width="2"/>

  <!-- shoes -->
  <ellipse cx="98" cy="223" rx="16" ry="8" fill="#222222"/>
  <ellipse cx="134" cy="223" rx="16" ry="8" fill="#222222"/>
</svg>
